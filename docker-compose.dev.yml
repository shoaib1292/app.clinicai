# ClinicAI — Local development stack
# PostgreSQL + Redis for the local app (app/landing/realtime/worker run on the host).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: clinicai-postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-clinicsai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-clinicsai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clinicsai} -d ${DB_NAME:-clinicsai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: clinicai-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --save 60 1000 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
